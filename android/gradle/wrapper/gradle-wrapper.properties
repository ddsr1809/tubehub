# Fija la version de Gradle del proyecto.
#
# Sin este archivo, el IDE usa el Gradle que tenga instalado (hoy, 9.x) y
# choca con el Android Gradle Plugin, que va por detras. El sintoma tipico es:
#   Task 'prepareKotlinBuildScriptModel' not found in project ':app'
#
# La combinacion de abajo es conservadora a proposito:
#   Gradle 8.11.1  +  AGP 8.7.3  +  Kotlin 2.1.0
# Para subir de version, usa Herramientas > AGP Upgrade Assistant en Android
# Studio: cambia el AGP y este archivo a la vez, que es justo lo que hay que
# mantener sincronizado.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
