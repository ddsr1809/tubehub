# Todo el servicio en tu VPS: base de datos y servidor.
#
#   docker compose up -d
#
# Los datos de Postgres viven en un volumen, asi que sobreviven a
# `docker compose down` y a las actualizaciones de la imagen.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NOMBRE:-relay}
      POSTGRES_USER: ${DB_USUARIO:-relay}
      POSTGRES_PASSWORD: ${DB_CLAVE:?Falta DB_CLAVE en el archivo .env}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # Sin `ports`: la base de datos NO se expone a internet. Solo la alcanza
    # el servidor a traves de la red interna de Docker. Si necesitas entrar
    # con psql desde fuera, hazlo por un tunel SSH, no abriendo el 5432.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USUARIO:-relay} -d ${DB_NOMBRE:-relay}"]
      interval: 10s
      timeout: 5s
      retries: 5

  servidor:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NOMBRE:-relay}
      DB_USUARIO: ${DB_USUARIO:-relay}
      DB_CLAVE: ${DB_CLAVE}
      RELAY_URL_PUBLICA: ${RELAY_URL_PUBLICA}
      JWT_SECRETO: ${JWT_SECRETO}
      WEBSUB_SECRETO: ${WEBSUB_SECRETO}
      WEBSUB_TOKEN_CALLBACK: ${WEBSUB_TOKEN_CALLBACK}
      TOKEN_INTERNO: ${TOKEN_INTERNO}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      FCM_PROYECTO_ID: ${FCM_PROYECTO_ID}
      FCM_CREDENCIALES: /secretos/fcm.json
      CORS_ORIGENES: ${CORS_ORIGENES}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_CLAVE_PRIVADA: ${APPLE_CLAVE_PRIVADA:-}
    volumes:
      # Solo lectura: el contenedor no tiene por que poder modificar la clave.
      - ${FCM_CREDENCIALES_HOST}:/secretos/fcm.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  datos_postgres:
